# Render Blueprint: deploys the API and the frontend on Render's free plan.
# The database is a free Postgres from Neon (https://neon.tech). See docs/DEPLOY.md.
services:
  - type: web
    name: codetogether-api
    runtime: python
    plan: free
    region: ohio # same region as the Neon database (AWS US East 2), for low latency
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Asked for when the Blueprint is created.
      - key: DATABASE_URL # Neon connection string: postgresql://...?sslmode=require
        sync: false
      - key: CORS_ORIGINS # the frontend URL, e.g. https://codetogether-web.onrender.com
        sync: false
      - key: GEMINI_API_KEY # free key from https://aistudio.google.com/apikey
        sync: false
      - key: OLLAMA_ENABLED # no local model on the server
        value: "false"

  - type: web
    name: codetogether-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL # the API URL, e.g. https://codetogether-api.onrender.com
        sync: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
